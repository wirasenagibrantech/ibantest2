<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Penjualan - JSON Viewer</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <!-- Export buttons -->
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

  <!-- ChartJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="container py-4">

  <h2 class="mb-4">Dashboard Penjualan</h2>

  <!-- FILTER -->
  <div class="row mb-4">
    <div class="col-md-3">
      <select id="filterTahun" class="form-select">
        <option value="">Semua Tahun</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="filterBulan" class="form-select">
        <option value="">Semua Bulan</option>
      </select>
    </div>
  </div>

  <!-- TABEL -->
  <table id="tabelData" class="table table-bordered"></table>

  <hr>

  <h3>Grafik Penjualan</h3>
  <canvas id="chartPenjualan" height="100"></canvas>

  <button id="downloadChart" class="btn btn-primary mt-3">Download Grafik PNG</button>

  <script>
    async function loadData() {
      const res = await fetch("json/data.json");
      const data = await res.json();
      return data;
    }

    let chart;

    loadData().then(data => {

  // Isi filter tahun dan bulan
      const tahunSet = [...new Set(data.map(r => r.tahun))];
      const bulanSet = [...new Set(data.map(r => r.bulan))];

      tahunSet.forEach(t => $("#filterTahun").append(`<option>${t}</option>`));
      bulanSet.forEach(b => $("#filterBulan").append(`<option>${b}</option>`));

  // DataTables
      $("#tabelData").DataTable({
        data: data,
        columns: [
          { data: "tanggal", title: "Tanggal" },
          { data: "penjualan", title: "Penjualan" }
          ],
        dom: "Bfrtip",
        buttons: ["excel", "pdf", "print"]
      });

  // ChartJS
      const ctx = document.getElementById("chartPenjualan");

      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: data.map(r => r.tanggal),
          datasets: [{
            label: "Penjualan",
            data: data.map(r => r.penjualan),
            borderWidth: 2
          }]
        }
      });

      document.getElementById("downloadChart").onclick = function(){
        const link = document.createElement("a");
        link.download = "grafik-penjualan.png";
        link.href = chart.toBase64Image();
        link.click();
      };

    });
  </script>

</body>
</html>
